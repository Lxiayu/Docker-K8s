apiVersion: v1
kind: ConfigMap
metadata:
  name: harbor-gc-config
  namespace: harbor-system
  labels:
    app: harbor
    component: gc
data:
  gc-config.yaml: |
    gc:
      enabled: true
      
      schedule: "0 0 0 * * *"
      
      deleteUntagged: true
      
      retention:
        enabled: true
        
        byDate:
          enabled: true
          keepDays: 30
        
        byCount:
          enabled: true
          keepCount: 10
        
        byTag:
          enabled: true
          patterns:
            - "latest"
            - "v*"
            - "*-stable"
      
      concurrency: 10
      
      timeout: 3h
      
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      
      notifications:
        enabled: true
        onSuccess: true
        onFailure: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-gc-job
  namespace: harbor-system
  labels:
    app: harbor
    component: gc
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: harbor
            component: gc
        spec:
          serviceAccountName: harbor-gc
          containers:
          - name: gc
            image: goharbor/harbor-core:v2.8.0
            command:
            - /bin/sh
            - -c
            - |
              execute_gc() {
                  local harbor_url="${HARBOR_URL:-https://harbor.local}"
                  local harbor_user="${HARBOR_ADMIN_USER:-admin}"
                  local harbor_pass="${HARBOR_ADMIN_PASSWORD}"
              
                  if [ -z "$harbor_pass" ]; then
                      echo "ERROR: HARBOR_ADMIN_PASSWORD not set"
                      return 1
                  fi
              
                  echo "Starting Harbor Garbage Collection..."
              
                  # Get CSRF token
                  local csrf_token=$(curl -sk -u "${harbor_user}:${harbor_pass}" \
                      "${harbor_url}/api/v2.0/system/gc/schedule" \
                      -H "X-IsForResourceList: true" | head -1)
              
                  # Create GC job
                  local response=$(curl -sk -X POST \
                      -u "${harbor_user}:${harbor_pass}" \
                      "${harbor_url}/api/v2.0/system/gc/schedule" \
                      -H "Content-Type: application/json" \
                      -d '{
                          "parameters": {
                              "delete_untagged": true,
                              "dry_run": false
                          },
                          "schedule": {
                              "type": "Manual"
                          }
                      }')
              
                  echo "GC job submitted: $response"
              
                  # Extract job ID and wait for completion
                  local job_id=$(echo "$response" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
              
                  if [ -n "$job_id" ]; then
                      echo "Waiting for GC job $job_id to complete..."
                      local status=""
                      for i in $(seq 1 60); do
                          status=$(curl -sk -u "${harbor_user}:${harbor_pass}" \
                              "${harbor_url}/api/v2.0/system/gc/${job_id}" | \
                              grep -o '"status":"[^"]*"' | cut -d'"' -f4)
                          echo "  Status: $status (attempt $i/60)"
                          if [ "$status" = "finished" ] || [ "$status" = "stopped" ] || [ "$status" = "error" ]; then
                              break
                          fi
                          sleep 10
                      done
              
                      if [ "$status" = "finished" ]; then
                          echo "Garbage collection completed successfully"
                          return 0
                      else
                          echo "Garbage collection ended with status: $status"
                          return 1
                      fi
                  else
                      echo "WARNING: Could not extract job ID, GC may have started"
                      return 0
                  fi
              }
              
              execute_gc
            env:
            - name: HARBOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: harbor-admin-password
                  key: password
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
          restartPolicy: OnFailure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-gc
  namespace: harbor-system
  labels:
    app: harbor
    component: gc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-gc-role
  namespace: harbor-system
  labels:
    app: harbor
    component: gc
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-gc-rolebinding
  namespace: harbor-system
  labels:
    app: harbor
    component: gc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harbor-gc-role
subjects:
- kind: ServiceAccount
  name: harbor-gc
  namespace: harbor-system
---
apiVersion: v1
kind: Secret
metadata:
  name: harbor-admin-password
  namespace: harbor-system
  labels:
    app: harbor
    component: gc
type: Opaque
stringData:
  password: "Harbor12345"
