name: Full CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod
      action:
        description: 'Action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - provision
          - deploy
          - rollback
          - cleanup

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE_PREFIX: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      github.event.inputs.action == 'deploy' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Run backend tests
        working-directory: ./backend
        run: |
          go mod download
          go test -v ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Run frontend tests
        working-directory: ./frontend
        run: |
          npm ci
          npm run test

      - name: Backend security scan
        if: github.event_name != 'pull_request'
        run: |
          cd backend
          go install github.com/securego/gosec/v2/cmd/gosec@v2.18.2
          gosec -fmt=json -out=gosec-report.json ./...

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Frontend security scan
        if: github.event_name != 'pull_request'
        run: |
          cd frontend
          npm audit --json > npm-audit-report.json || true

      - name: Build and push backend
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cicd-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/cicd-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/cicd-frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/cicd-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker image security scan
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/cicd-backend:${{ github.sha }}'
          format: 'json'
          output: 'trivy-backend-report.json'
          severity: 'HIGH,CRITICAL'

      - name: Docker image security scan (frontend)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/cicd-frontend:${{ github.sha }}'
          format: 'json'
          output: 'trivy-frontend-report.json'
          severity: 'HIGH,CRITICAL'

      - name: Upload security scan reports
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            backend/gosec-report.json
            frontend/npm-audit-report.json
            trivy-backend-report.json
            trivy-frontend-report.json
          retention-days: 7

  provision:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'provision'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate KUBE_CONFIG secret
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "::error::KUBE_CONFIG secret is not set. Please configure it in GitHub Secrets."
            exit 1
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      - name: Create namespace
        run: |
          kubectl create namespace cicd-${{ github.event.inputs.environment }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create database namespace
        run: |
          kubectl apply -f database/namespace.yaml

      - name: Create database secrets
        run: |
          kubectl create secret generic database-secret \
            --from-literal=password=${{ secrets.DATABASE_PASSWORD }} \
            -n cicd-${{ github.event.inputs.environment }} \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic jwt-secret \
            --from-literal=secret=${{ secrets.JWT_SECRET }} \
            -n cicd-${{ github.event.inputs.environment }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy database
        run: |
          kubectl apply -f database/postgres/ -n database

      - name: Deploy Redis
        run: |
          kubectl apply -f kubernetes/redis-deployment.yaml
          kubectl apply -f kubernetes/redis-service.yaml

      - name: Wait for database to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=postgresql -n database --timeout=300s

      - name: Wait for Redis to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=redis -n database --timeout=300s

      - name: Deploy ingress
        run: |
          kubectl apply -f kubernetes/ingress/nginx-ingress.yaml || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: production
      url: https://cicd.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate KUBE_CONFIG secret
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "::error::KUBE_CONFIG secret is not set. Please configure it in GitHub Secrets."
            exit 1
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Create secrets if not exist
        run: |
          kubectl create secret generic database-secret \
            --from-literal=password=${{ secrets.DATABASE_PASSWORD }} \
            -n cicd-system \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic jwt-secret \
            --from-literal=secret=${{ secrets.JWT_SECRET }} \
            -n cicd-system \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy using blue-green strategy
        run: |
          cat kubernetes/backend-blue-green-deployment.yaml | \
            sed "s|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/cicd-backend:${{ github.sha }}|g" | \
            kubectl apply -n cicd-system -f -

          kubectl scale deployment cicd-backend-green --replicas=2 -n cicd-system
          kubectl rollout status deployment/cicd-backend-green -n cicd-system --timeout=300s
          kubectl patch service cicd-backend -n cicd-system --type=json -p '[{"op":"replace","path":"/spec/selector/version","value":"green"}]'

          cat kubernetes/frontend-blue-green-deployment.yaml | \
            sed "s|image:.*|image: ${{ secrets.DOCKER_USERNAME }}/cicd-frontend:${{ github.sha }}|g" | \
            kubectl apply -n cicd-system -f -

          kubectl scale deployment cicd-frontend-green --replicas=2 -n cicd-system
          kubectl rollout status deployment/cicd-frontend-green -n cicd-system --timeout=300s
          kubectl patch service cicd-frontend -n cicd-system --type=json -p '[{"op":"replace","path":"/spec/selector/version","value":"green"}]'

      - name: Get deployment status
        run: |
          echo "=== Deployment Status ==="
          kubectl get pods -n cicd-system
          kubectl get services -n cicd-system

  rollback:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'rollback'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate KUBE_CONFIG secret
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "::error::KUBE_CONFIG secret is not set. Please configure it in GitHub Secrets."
            exit 1
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Rollback using blue-green strategy
        run: |
          kubectl patch service cicd-backend -n cicd-system --type=json -p '[{"op":"replace","path":"/spec/selector/version","value":"blue"}]'
          kubectl patch service cicd-frontend -n cicd-system --type=json -p '[{"op":"replace","path":"/spec/selector/version","value":"blue"}]'

          kubectl scale deployment cicd-backend-green --replicas=0 -n cicd-system
          kubectl scale deployment cicd-frontend-green --replicas=0 -n cicd-system

          kubectl rollout status deployment/cicd-backend-blue -n cicd-system --timeout=300s
          kubectl rollout status deployment/cicd-frontend-blue -n cicd-system --timeout=300s

      - name: Verify rollback
        run: |
          kubectl rollout status deployment/cicd-backend -n cicd-system --timeout=60s
          kubectl rollout status deployment/cicd-frontend -n cicd-system --timeout=60s
          BACKEND_POD=$(kubectl get pods -n cicd-system -l app=cicd-backend -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n cicd-system $BACKEND_POD -- wget -qO- http://localhost:8080/health || exit 1

  cleanup:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'cleanup'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate KUBE_CONFIG secret
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "::error::KUBE_CONFIG secret is not set. Please configure it in GitHub Secrets."
            exit 1
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Cleanup resources
        run: |
          echo "Cleaning up namespace cicd-system..."
          kubectl delete namespace cicd-system --ignore-not-found
          echo "Cleanup completed"
