apiVersion: v1
kind: Namespace
metadata:
  name: cicd-system
  labels:
    name: cicd-system
    environment: production
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: cicd-system
type: Opaque
stringData:
  database-url: "postgres://cicd:cicd123@postgres.database.svc.cluster.local:5432/cicd_platform?sslmode=disable"
  jwt-secret: "your-secret-key-change-in-production"
  redis-url: "redis://redis:6379/0"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: cicd-system
data:
  config.yaml: |
    server:
      port: 8080
      mode: release
      read_timeout: 60s
      write_timeout: 60s
    
    database:
      host: postgres.database.svc.cluster.local
      port: 5432
      user: cicd
      # NOTE: In production, use environment variables or K8s Secrets
      # This ConfigMap is for development only
      password: "${POSTGRES_PASSWORD}"
      dbname: cicd_platform
      sslmode: disable
      max_open_conns: 100
      max_idle_conns: 10
      conn_max_lifetime: 1h
    
    redis:
      host: redis
      port: 6379
      password: ""
      db: 0
    
    jwt:
      # NOTE: In production, use environment variables or K8s Secrets
      secret: "${JWT_SECRET}"
      expire_time: 24h
    
    log:
      level: info
      filename: /app/logs/app.log
      max_size: 100
      max_backups: 10
      max_age: 30
      compress: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cicd-system
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: cicd-backend
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
        image: harbor.local/cicd-platform/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: CONFIG_PATH
          value: /app/configs/config.yaml
        volumeMounts:
        - name: config
          mountPath: /app/configs
          readOnly: true
        - name: logs
          mountPath: /app/logs
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: backend-config
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cicd-system
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: backend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: cicd-system
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.cicd-platform.local
    secretName: backend-tls
  rules:
  - host: api.cicd-platform.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-monitor
  namespace: cicd-system
  labels:
    app: backend
    release: prometheus
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
