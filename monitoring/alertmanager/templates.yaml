apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-templates
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: alerting
data:
  default.tmpl: |
    {{ define "__subject" }}
    [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .GroupLabels.SortedPairs.Values | join " " }}
    {{ end }}

    {{ define "__text_alert_list" }}
    {{ range .Alerts }}
    *Alert:* {{ .Labels.alertname }}
    *Severity:* {{ .Labels.severity }}
    *Namespace:* {{ .Labels.namespace }}
    *Summary:* {{ .Annotations.summary }}
    *Description:* {{ .Annotations.description }}
    *Started:* {{ .StartsAt }}
    {{ if .EndsAt }}*Ended:* {{ .EndsAt }}{{ end }}
    {{ end }}
    {{ end }}

    {{ define "email.default.subject" }}
    {{ template "__subject" . }}
    {{ end }}

    {{ define "email.default.html" }}
    <h2>{{ template "__subject" . }}</h2>
    {{ template "__text_alert_list" .Alerts }}
    {{ end }}

    {{ define "wechat.default.message" }}
    {{ if eq .Status "firing" }}
    告警触发: {{ .Alerts.Firing | len }} 个告警
    {{ template "__text_alert_list" .Alerts.Firing }}
    {{ else if eq .Status "resolved" }}
    告警恢复: {{ .Alerts.Resolved | len }} 个告警
    {{ template "__text_alert_list" .Alerts.Resolved }}
    {{ end }}
    {{ end }}

    {{ define "wechat.critical.message" }}
    【严重告警】
    {{ template "wechat.default.message" . }}
    {{ end }}

    {{ define "wechat.warning.message" }}
    【警告告警】
    {{ template "wechat.default.message" . }}
    {{ end }}

    {{ define "dingtalk.default.message" }}
    {
      "msgtype": "markdown",
      "markdown": {
        "title": "{{ template "__subject" . }}",
        "text": "{{ if eq .Status "firing" }}### 告警触发\n{{ else }}### 告警恢复\n{{ end }}{{ range .Alerts }}\n**告警名称:** {{ .Labels.alertname }}\n**严重级别:** {{ .Labels.severity }}\n**命名空间:** {{ .Labels.namespace }}\n**摘要:** {{ .Annotations.summary }}\n**描述:** {{ .Annotations.description }}\n**开始时间:** {{ .StartsAt }}\n{{ if .EndsAt }}**结束时间:** {{ .EndsAt }}{{ end }}\n{{ end }}"
      }
    }
    {{ end }}
