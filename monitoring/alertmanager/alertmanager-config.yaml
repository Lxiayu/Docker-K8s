apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: alerting
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.example.com:587'
      smtp_from: 'alertmanager@example.com'
      smtp_auth_username: 'alertmanager@example.com'
      smtp_auth_password: 'your-email-password'
      smtp_require_tls: true

    templates:
      - '/etc/alertmanager/config/*.tmpl'

    route:
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'default-receiver'
      routes:
        - match:
            severity: critical
          receiver: 'critical-receiver'
          continue: false
        - match:
            severity: warning
          receiver: 'warning-receiver'
          continue: false

    receivers:
      - name: 'default-receiver'
        email_configs:
          - to: 'admin@example.com'
            send_resolved: true
            headers:
              Subject: '[Alert] {{ .GroupLabels.alertname }} - {{ .GroupLabels.namespace }}'

      - name: 'critical-receiver'
        email_configs:
          - to: 'admin@example.com,oncall@example.com'
            send_resolved: true
            headers:
              Subject: '[CRITICAL] {{ .GroupLabels.alertname }} - {{ .GroupLabels.namespace }}'
        webhook_configs:
          - url: 'http://webhook-receiver:5000/webhook'
            send_resolved: true

      - name: 'warning-receiver'
        email_configs:
          - to: 'admin@example.com'
            send_resolved: true
            headers:
              Subject: '[WARNING] {{ .GroupLabels.alertname }} - {{ .GroupLabels.namespace }}'

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'namespace']
