apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-wechat-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: alerting
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      wechat_api_url: 'https://qyapi.weixin.qq.com/cgi-bin/'
      wechat_api_corp_id: 'your-corp-id'
      wechat_api_agent_id: 'your-agent-id'
      wechat_api_secret: 'your-api-secret'

    route:
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'wechat-receiver'
      routes:
        - match:
            severity: critical
          receiver: 'wechat-critical'
          continue: false
        - match:
            severity: warning
          receiver: 'wechat-warning'
          continue: false

    receivers:
      - name: 'wechat-receiver'
        wechat_configs:
          - send_resolved: true
            to_party: '1'
            to_user: '@all'
            message: '{{ template "wechat.default.message" . }}'

      - name: 'wechat-critical'
        wechat_configs:
          - send_resolved: true
            to_party: '1'
            to_user: '@all'
            message: '{{ template "wechat.critical.message" . }}'

      - name: 'wechat-warning'
        wechat_configs:
          - send_resolved: true
            to_party: '2'
            to_user: '@all'
            message: '{{ template "wechat.warning.message" . }}'
