apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-dingtalk-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: alerting
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'dingtalk-receiver'
      routes:
        - match:
            severity: critical
          receiver: 'dingtalk-critical'
          continue: false
        - match:
            severity: warning
          receiver: 'dingtalk-warning'
          continue: false

    receivers:
      - name: 'dingtalk-receiver'
        webhook_configs:
          - url: 'http://dingtalk-webhook:8060/dingtalk/webhook1/send'
            send_resolved: true

      - name: 'dingtalk-critical'
        webhook_configs:
          - url: 'http://dingtalk-webhook:8060/dingtalk/webhook_critical/send'
            send_resolved: true

      - name: 'dingtalk-warning'
        webhook_configs:
          - url: 'http://dingtalk-webhook:8060/dingtalk/webhook_warning/send'
            send_resolved: true
