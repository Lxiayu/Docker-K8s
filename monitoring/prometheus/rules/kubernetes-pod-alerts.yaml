apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-pod-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kubernetes-pod-alerts
    app.kubernetes.io/component: alerting
    release: prometheus-operator
spec:
  groups:
    - name: pod-alerts
      interval: 30s
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 频繁重启"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 在过去 15 分钟内重启了 {{ $value }} 次，可能存在应用问题。"

        - alert: PodNotReady
          expr: kube_pod_status_phase{phase=~"Pending|Unknown"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 未就绪"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 已经超过 10 分钟处于 {{ $labels.phase }} 状态。"

        - alert: PodHighCPU
          expr: sum(rate(container_cpu_usage_seconds_total{container!=""}[5m])) by (namespace, pod) / sum(kube_pod_container_resource_limits{resource="cpu"}) by (namespace, pod) * 100 > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} CPU 使用率过高"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} CPU 使用率超过限制的 80%，当前值为 {{ $value }}%。"

        - alert: PodHighMemory
          expr: sum(container_memory_working_set_bytes{container!=""}) by (namespace, pod) / sum(kube_pod_container_resource_limits{resource="memory"}) by (namespace, pod) * 100 > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 内存使用率过高"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 内存使用率超过限制的 80%，当前值为 {{ $value }}%。"

        - alert: ContainerOomKilled
          expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "容器 {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} 因 OOM 被终止"
            description: "容器 {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} 因内存不足被 OOM Killed，请增加内存限制或优化应用。"

        - alert: DeploymentReplicasUnavailable
          expr: kube_deployment_status_replicas_unavailable / kube_deployment_spec_replicas > 0.3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} 副本不可用"
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} 有超过 30% 的副本不可用。"
