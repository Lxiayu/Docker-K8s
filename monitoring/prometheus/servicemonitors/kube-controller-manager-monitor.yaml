apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-controller-manager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-controller-manager
    app.kubernetes.io/component: monitoring
    release: prometheus-operator
spec:
  jobLabel: k8s-app
  selector:
    matchLabels:
      k8s-app: kube-controller-manager
  namespaceSelector:
    matchNames:
      - kube-system
  endpoints:
    - port: http-metrics
      scheme: http
      interval: 30s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'controller_manager_(workqueue_depth|workqueue_adds_total|workqueue_queue_duration_seconds)'
          action: keep
