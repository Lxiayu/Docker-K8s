apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: elasticsearch-storage
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/component: storage
provisioner: kubernetes.io/gce-pd
parameters:
  type: pd-ssd
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: logging-standard
  labels:
    app.kubernetes.io/name: standard-storage
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp2
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data-elasticsearch-0
  namespace: logging
  labels:
    app: elasticsearch
    app.kubernetes.io/name: elasticsearch
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: logging-standard
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data-elasticsearch-1
  namespace: logging
  labels:
    app: elasticsearch
    app.kubernetes.io/name: elasticsearch
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: logging-standard
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-data-elasticsearch-2
  namespace: logging
  labels:
    app: elasticsearch
    app.kubernetes.io/name: elasticsearch
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: logging-standard
  resources:
    requests:
      storage: 50Gi
