# 蓝绿部署配置 - 前端

# Blue 部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-frontend-blue
  labels:
    app: cicd-frontend
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-frontend
      version: blue
  template:
    metadata:
      labels:
        app: cicd-frontend
        version: blue
    spec:
      containers:
      - name: frontend
        image: docker.io/USERNAME/cicd-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
---
# Green 部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-frontend-green
  labels:
    app: cicd-frontend
    version: green
spec:
  replicas: 0  # 初始副本数为0
  selector:
    matchLabels:
      app: cicd-frontend
      version: green
  template:
    metadata:
      labels:
        app: cicd-frontend
        version: green
    spec:
      containers:
      - name: frontend
        image: docker.io/USERNAME/cicd-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
---
# 服务配置 - 用于切换流量
apiVersion: v1
kind: Service
metadata:
  name: cicd-frontend
  labels:
    app: cicd-frontend
spec:
  selector:
    app: cicd-frontend
    version: blue  # 初始指向 blue 版本
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
