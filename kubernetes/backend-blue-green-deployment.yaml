# 蓝绿部署配置 - 后端

# Blue 部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-backend-blue
  labels:
    app: cicd-backend
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-backend
      version: blue
  template:
    metadata:
      labels:
        app: cicd-backend
        version: blue
    spec:
      containers:
      - name: backend
        image: docker.io/USERNAME/cicd-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: SERVER_PORT
          value: "8080"
        - name: DATABASE_HOST
          value: "postgres-service.database.svc.cluster.local"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_USER
          value: "cicd_admin"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: password
        - name: DATABASE_NAME
          value: "cicd_platform"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        - name: LOG_LEVEL
          value: "info"
        - name: REDIS_HOST
          value: "redis-service.database.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          value: ""
        - name: REDIS_DB
          value: "0"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
---
# Green 部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-backend-green
  labels:
    app: cicd-backend
    version: green
spec:
  replicas: 0  # 初始副本数为0
  selector:
    matchLabels:
      app: cicd-backend
      version: green
  template:
    metadata:
      labels:
