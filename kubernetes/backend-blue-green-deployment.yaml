          value: "8080"
        - name: DATABASE_HOST
          value: "postgres-service.database.svc.cluster.local"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_USER
          value: "cicd_admin"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: password
        - name: DATABASE_NAME
          value: "cicd_platform"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        - name: LOG_LEVEL
          value: "info"
        - name: REDIS_HOST
          value: "redis-service.database.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD
          value: ""
        - name: REDIS_DB
          value: "0"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
