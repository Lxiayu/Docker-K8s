---
# 服务配置 - 用于切换流量
apiVersion: v1
kind: Service
metadata:
  name: cicd-backend
  labels:
    app: cicd-backend
spec:
  selector:
    app: cicd-backend
    version: blue  # 初始指向 blue 版本
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP
