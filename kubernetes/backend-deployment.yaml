apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-backend
  labels:
    app: cicd-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-backend
  template:
    metadata:
      labels:
        app: cicd-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/${{ github.repository_owner }}/cicd-backend:IMAGE_TAG
        ports:
        - containerPort: 8080
        env:
        - name: ENVIRONMENT
          value: "ENVIRONMENT"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: url
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cicd-backend
  labels:
    app: cicd-backend
spec:
  selector:
    app: cicd-backend
  ports:
  - port: 8080
    targetPort: 8080
  type: ClusterIP