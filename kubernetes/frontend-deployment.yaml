apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-frontend
  labels:
    app: cicd-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-frontend
  template:
    metadata:
      labels:
        app: cicd-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/${{ github.repository_owner }}/cicd-frontend:IMAGE_TAG
        ports:
        - containerPort: 80
        env:
        - name: VITE_API_BASE_URL
          value: "http://cicd-backend:8080/api"
        - name: VITE_APP_TITLE
          value: "CI/CD Platform"
        - name: VITE_ENV
          value: "production"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 15