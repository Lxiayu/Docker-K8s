kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cicd-cluster
nodes:
  - role: control-plane
    image: kindest/node:v1.28.0
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP
      - containerPort: 30003
        hostPort: 30003
        protocol: TCP
    extraMounts:
      - hostPath: /Users/xia/program/Docker-K8s/data
        containerPath: /data
  - role: worker
    image: kindest/node:v1.28.0
    extraMounts:
      - hostPath: /Users/xia/program/Docker-K8s/data
        containerPath: /data
  - role: worker
    image: kindest/node:v1.28.0
    extraMounts:
      - hostPath: /Users/xia/program/Docker-K8s/data
        containerPath: /data
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
  serviceSubnet: "10.96.0.0/12"
featureGates:
  InPlacePodVerticalScaling: true
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
      endpoint = ["https://docker.m.daocloud.io"]
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."k8s.gcr.io"]
      endpoint = ["https://k8s-gcr.m.daocloud.io"]
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."registry.k8s.io"]
      endpoint = ["https://registry-k8s.m.daocloud.io"]
