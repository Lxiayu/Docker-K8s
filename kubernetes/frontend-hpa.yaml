apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cicd-frontend-hpa
  namespace: cicd-system
  labels:
    app.kubernetes.io/name: cicd-frontend
    app.kubernetes.io/part-of: cicd-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cicd-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
