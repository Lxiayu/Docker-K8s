apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-backup-scripts
  namespace: database
  labels:
    app.kubernetes.io/name: postgresql-backup
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cicd-platform
data:
  backup.sh: |
    #!/bin/sh
    set -e
    
    BACKUP_DATE=$(date +%Y%m%d_%H%M%S)
    BACKUP_FILE="/backup/manual/cicd_platform_manual_${BACKUP_DATE}.sql.gz"
    
    mkdir -p /backup/manual
    
    echo "Starting manual backup at $(date)"
    
    pg_dump -h postgres-service \
      -U backup_user \
      -d cicd_platform \
      -F p \
      --no-owner \
      --no-acl \
      --clean \
      --if-exists \
      | gzip > ${BACKUP_FILE}
    
    if [ $? -eq 0 ]; then
      echo "Manual backup completed successfully: ${BACKUP_FILE}"
      ls -lh ${BACKUP_FILE}
    else
      echo "Manual backup failed!"
      exit 1
    fi
    
  restore.sh: |
    #!/bin/sh
    set -e
    
    if [ -z "$1" ]; then
      echo "Usage: restore.sh <backup_file>"
      echo "Available backups:"
      ls -lh /backup/*.sql.gz 2>/dev/null || echo "No backups found in /backup/"
      ls -lh /backup/weekly/*.sql.gz 2>/dev/null || echo "No weekly backups found"
      ls -lh /backup/manual/*.sql.gz 2>/dev/null || echo "No manual backups found"
      exit 1
    fi
    
    BACKUP_FILE="$1"
    
    if [ ! -f "$BACKUP_FILE" ]; then
      echo "Backup file not found: ${BACKUP_FILE}"
      exit 1
    fi
    
    echo "Starting restore from: ${BACKUP_FILE}"
    echo "Warning: This will replace the current database!"
    read -p "Are you sure? (yes/no): " confirm
    
    if [ "$confirm" != "yes" ]; then
      echo "Restore cancelled"
      exit 0
    fi
    
    gunzip -c ${BACKUP_FILE} | psql -h postgres-service -U cicd_admin -d cicd_platform
    
    if [ $? -eq 0 ]; then
      echo "Restore completed successfully"
    else
      echo "Restore failed!"
      exit 1
    fi
    
  list-backups.sh: |
    #!/bin/sh
    
    echo "=== Daily Backups ==="
    ls -lh /backup/*.sql.gz 2>/dev/null || echo "No daily backups found"
    
    echo ""
    echo "=== Weekly Backups ==="
    ls -lh /backup/weekly/*.sql.gz 2>/dev/null || echo "No weekly backups found"
    
    echo ""
    echo "=== Manual Backups ==="
    ls -lh /backup/manual/*.sql.gz 2>/dev/null || echo "No manual backups found"
