apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-monitor
  namespace: database
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cicd-platform
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/component: database
  endpoints:
  - port: postgres
    interval: 30s
    path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgres-alerts
  namespace: database
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cicd-platform
    release: prometheus
spec:
  groups:
  - name: postgres.rules
    rules:
    - alert: PostgresInstanceDown
      expr: up{job="postgres"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "PostgreSQL instance is down"
        description: "PostgreSQL instance {{ $labels.instance }} has been down for more than 5 minutes."
    
    - alert: PostgresConnectionsHigh
      expr: pg_stat_activity_count / pg_settings_max_connections * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL connections are high"
        description: "PostgreSQL connections are at {{ $value }}% of maximum."
    
    - alert: PostgresReplicationLag
      expr: pg_replication_lag > 30
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL replication lag is high"
        description: "PostgreSQL replication lag is {{ $value }} seconds."
    
    - alert: PostgresDeadlocks
      expr: rate(pg_stat_database_deadlocks[5m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL deadlocks detected"
        description: "PostgreSQL is experiencing deadlocks at {{ $value }} per second."
    
    - alert: PostgresSlowQueries
      expr: pg_stat_statements_mean_exec_time > 1000
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL slow queries detected"
        description: "PostgreSQL average query execution time is {{ $value }}ms."
    
    - alert: PostgresDiskUsage
      expr: pg_database_size_bytes / 1024 / 1024 / 1024 > 40
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL database size is large"
        description: "PostgreSQL database size is {{ $value }}GB."
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: database
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cicd-platform
spec:
  type: ClusterIP
  ports:
  - port: 9187
    targetPort: 9187
    name: metrics
  selector:
    app.kubernetes.io/name: postgres-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: database
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cicd-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
        app.kubernetes.io/component: database
    spec:
      containers:
      - name: postgres-exporter
        image: quay.io/prometheuscommunity/postgres-exporter:v0.12.0
        ports:
        - containerPort: 9187
          name: metrics
        env:
        - name: DATA_SOURCE_NAME
          value: "postgresql://cicd_admin:CICD_Secure_Pass_2024@postgres-service:5432/cicd_platform?sslmode=disable"
        - name: PG_EXPORTER_EXTEND_QUERY_PATH
          value: "/etc/postgres_exporter/queries.yaml"
        volumeMounts:
        - name: queries
          mountPath: /etc/postgres_exporter
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: queries
        configMap:
          name: postgres-exporter-queries
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-queries
  namespace: database
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/component: database
data:
  queries.yaml: |
    pg_replication:
      query: "SELECT EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp())) AS lag"
      metrics:
        - lag:
            usage: "GAUGE"
            description: "Replication lag in seconds"
    
    pg_stat_activity:
      query: "SELECT count(*) AS count FROM pg_stat_activity WHERE state = 'active'"
      metrics:
        - count:
            usage: "GAUGE"
            description: "Number of active connections"
    
    pg_database_size:
      query: "SELECT datname, pg_database_size(datname) AS size FROM pg_database WHERE datistemplate = false"
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - size:
            usage: "GAUGE"
            description: "Database size in bytes"
